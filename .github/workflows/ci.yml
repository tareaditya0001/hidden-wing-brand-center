name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore HiddenWing.BrandCenter.sln
      - name: Build
        run: dotnet build HiddenWing.BrandCenter.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test HiddenWing.BrandCenter.sln --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/hidden-wing-brand-center-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f deploy/docker/backend.Dockerfile -t hidden-wing-brand-center-api .
      - name: Build frontend image
        run: docker build -f deploy/docker/frontend.Dockerfile -t hidden-wing-brand-center-web .
