services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hidden_wing_brand_center
      POSTGRES_USER: brandcenter
      POSTGRES_PASSWORD: brandcenter_dev
    ports:
      - "5432:5432"
    volumes:
      - brandcenter_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandcenter -d hidden_wing_brand_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=hidden_wing_brand_center;Username=brandcenter;Password=brandcenter_dev
      Database__ApplyMigrations: "true"
      CORS__AllowedOrigins__0: http://localhost:5173
      Security__JwtSecret: DEV_ONLY_CHANGE_ME_HIDDEN_WING_BRAND_CENTER_32
      Security__AdminUsername: admin
      Security__AdminPassword: admin
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  brandcenter_pg_dev:
